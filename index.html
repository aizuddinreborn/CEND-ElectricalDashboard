<script>
(() => {
  const BOX = JSON.parse(document.getElementById('cend-box').textContent);
  const te = new TextEncoder(), td = new TextDecoder();
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (u) => btoa(String.fromCharCode(...u));
  const $ = (id) => document.getElementById(id);
  async function unwrap(pw) {
    const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(BOX.salt), iterations: BOX.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BOX.wrapIv) }, kek, b64(BOX.wrapped)));
  }
  async function open(raw) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(BOX.iv) }, key, b64(BOX.ct));
    const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  }
  const store = (raw, keep) => { try { (keep ? localStorage : sessionStorage).setItem('cend-key', toB64(raw)); } catch (e) { /* ignore */ } };
  const saved = () => { try { return localStorage.getItem('cend-key') || sessionStorage.getItem('cend-key'); } catch (e) { return null; } };
  const forget = () => { try { localStorage.removeItem('cend-key'); sessionStorage.removeItem('cend-key'); } catch (e) { /* ignore */ } };
  if (!window.crypto || !crypto.subtle || !window.DecompressionStream) { $('msg').textContent = 'This browser is too old to open the dashboard. Please use a current Chrome, Edge, Safari or Firefox.'; $('go').disabled = true; return; }
  const s = saved();
  if (s) { document.body.classList.add('booting'); open(b64(s)).catch(() => { forget(); document.body.classList.remove('booting'); }); }
  $('eye').addEventListener('click', () => { const p = $('pw'); p.type = p.type === 'password' ? 'text' : 'password'; });
  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = $('pw').value; if (!pw) return;
    $('go').disabled = true; $('msg').textContent = ''; $('go').textContent = 'Checking…';
    let raw;
    try { raw = await unwrap(pw); } catch (err) { $('msg').textContent = 'Wrong password. Please try again.'; $('go').disabled = false; $('go').textContent = 'Open dashboard'; $('pw').select(); return; }
    store(raw, $('remember').checked);
    document.body.classList.add('booting');
    try { await open(raw); } catch (err) { forget(); document.body.classList.remove('booting'); $('msg').textContent = 'The dashboard could not be opened. Reload the page and try again.'; $('go').disabled = false; $('go').textContent = 'Open dashboard'; }
  });
})();
</script>
